[project]
name = "KnowAI SSE Documentation"
description = "语义种子扩展引擎文档"

[build]
target = "site"

[markdown]
extensions = [
    "pymdownx.highlight",
    "pymdownx.superfences",
    "pymdownx.tabbed",
    "pymdownx.tasklist"
]

[theme]
name = "material"
language = "zh"
features = [
    "navigation.tabs",
    "navigation.sections",
    "toc.integrate",
    "search.suggest",
    "search.highlight"
]

theme.palette = [
  { "media": "(prefers-color-scheme: light)", "scheme": "default", "primary": "indigo", "accent": "indigo", "toggle": { "icon": "material/brightness-7", "name": "切换到深色模式" } },
  { "media": "(prefers-color-scheme: dark)", "scheme": "slate", "primary": "indigo", "accent": "indigo", "toggle": { "icon": "material/brightness-4", "name": "切换到浅色模式" } }
]

[nav]
Home = "index.md"
用户指南 = [
  "guide/installation.md",
  "guide/quickstart.md",
  "guide/concepts.md"
]
API 参考 = [
  "api/expander.md",
  "api/prompt_mgr.md",
  "api/llm_client.md",
  "api/models.md"
]
开发者指南 = [
  "dev/testing.md",
  "dev/contributing.md"
]
