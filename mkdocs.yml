site_name: KnowAI SSE Documentation
site_description: Semantic Seed Expander Documentation
site_author: KnowAI Team

repo_name: knowai-sse
repo_url: https://github.com/tobegold574/knowai-sse

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - attr_list
  - md_in_html

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode


nav:
  - Home: index.md
  - User Guide:
      - guide/installation.md
      - guide/quickstart.md
      - guide/concepts.md
  - API Reference:
      - api/expander.md
      - api/prompt_mgr.md
      - api/llm_client.md
      - api/models.md
  - Developer Guide:
      - dev/testing.md
      - dev/contributing.md
